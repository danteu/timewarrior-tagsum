name: Push workflow

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  analyze-with-pylint:
    runs-on: ubuntu-latest
    strategy:
      matrix: &python-matrix
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
      - name: Analysing the code with pylint
        run: |
          pylint $(git ls-files '*.py')
  test-with-test-input:
    runs-on: ubuntu-latest
    strategy:
      matrix: *python-matrix
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
    - name: Analysing the code with pylint
      run: |
        pylint $(git ls-files '*.py')
    - name: Testing the tagsum script
      run: |
        INPUT=$(cat <<EOF
        color: on
        confirmation: on
        debug: off
        journal.size: -1
        reports.day.axis: internal
        reports.day.cell: 15
        reports.day.day: yes
        reports.day.holidays: no
        reports.day.hours: all
        reports.day.lines: 2
        reports.day.month: no
        reports.day.spacing: 1
        reports.day.summary: yes
        reports.day.totals: no
        reports.day.week: no
        reports.day.weekday: yes
        reports.month.cell: 15
        reports.month.day: yes
        reports.month.holidays: yes
        reports.month.hours: all
        reports.month.lines: 1
        reports.month.month: yes
        reports.month.spacing: 1
        reports.month.summary: yes
        reports.month.totals: yes
        reports.month.week: yes
        reports.month.weekday: yes
        reports.summary.holidays: yes
        reports.week.cell: 15
        reports.week.day: yes
        reports.week.holidays: yes
        reports.week.hours: all
        reports.week.lines: 1
        reports.week.month: no
        reports.week.spacing: 1
        reports.week.summary: yes
        reports.week.totals: yes
        reports.week.week: yes
        reports.week.weekday: yes
        temp.report.end:
        temp.report.start:
        temp.report.tags:
        temp.version: 1.7.1
        theme.colors.exclusion: gray8 on gray4
        theme.colors.holiday: gray4
        theme.colors.label: gray4
        theme.colors.today: white
        theme.description: Built-in default
        verbose: on
        
        [
        {"id":5,"start":"20230904T231719Z","end":"20230904T231724Z","tags":["asdf"]},
        {"id":4,"start":"20230904T231724Z","end":"20230904T231726Z","tags":["wasd"]},
        {"id":3,"start":"20230904T233012Z","end":"20230904T233017Z","tags":["wasdf"]},
        {"id":2,"start":"20230904T233017Z","end":"20230904T233019Z","tags":["was"]},
        {"id":1,"start":"20241111T230955Z","end":"20241111T231001Z","tags":["foo"]}
        ]
        EOF
        )

        EXPECTED=$(cat <<EOF
        asdf  -- 0:00:05
        foo   -- 0:00:06
        was   -- 0:00:02
        wasd  -- 0:00:02
        wasdf -- 0:00:05

        Total -- 0:00:20

        EOF
        )

        OUTPUT=$(python tagsum.py <<< "$INPUT")

        if [ "$OUTPUT" != "$EXPECTED" ]; then
          echo "Output does not match expected"
          echo "Expected:"
          echo "$EXPECTED"
          echo "Output:"
          echo "$OUTPUT"
          exit 1
        fi
  test-with-timew:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install Timewarrior
      run: |
        sudo apt-get update
        sudo apt-get install -y timewarrior
    - name: Setup timewarrior database
      run: |
        echo "yes" | timew
    - name: Track some time entries
      run: |
        timew track 9am - 11am 'Task 1'
        timew track 12pm - 1pm 'Task 2'
        timew track 3pm - 5pm 'Task 1'
    - name: Install tagsum
      run: |
        EXTENSIONS_DIR=$(timew extensions | sed -n '/Extensions located in:/{n;p}' | awk '{$1=$1};1')
        mkdir -p "$EXTENSIONS_DIR"
        cp tagsum.py "$EXTENSIONS_DIR/tagsum"
        chmod +x "$EXTENSIONS_DIR/tagsum"
    - name: Run tagsum report
      run: |
        TAGSUM_OUTPUT=$(timew tagsum today)
        EXPECTED_OUTPUT=$(cat <<EOF
        Task 1 -- 4:00:00
        Task 2 -- 1:00:00

        Total  -- 5:00:00
        EOF
        )
        if [ "$TAGSUM_OUTPUT" != "$EXPECTED_OUTPUT" ]; then
          echo "Tagsum output does not match expected"
          echo "Expected:"
          echo "$EXPECTED_OUTPUT"
          echo "Got:"
          echo "$TAGSUM_OUTPUT"
          exit 1
        fi
